[package]
name = "tree-sitter-c"
version = "0.24.2"
edition = "2021"
license = "MIT"
# Patched: parser.c pre-compiled to lib/libtree_sitter_c.a for wasm32-wasip2
# (zig cc, see docs/WASM_BUILD_PATCHES.md). Native builds compile the C source.
build = "build.rs"
autolib = false

[lib]
name = "tree_sitter_c"
path = "bindings/rust/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies]
cc = "1"
